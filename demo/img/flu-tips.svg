<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520" font-family="Arial,sans-serif"><rect width="400" height="520" fill="#fff7e6"/><rect width="400" height="80" fill="#c0392b"/><text x="200" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff">Stay Healthy This Winter</text>
<g font-size="17" fill="#222"><circle cx="50" cy="130" r="22" fill="#2f5bd3"/><text x="50" y="137" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="88" y="126">Wash hands for 20 seconds</text><text x="88" y="148" font-size="13" fill="#555">Before lunch and after recess</text>
<circle cx="50" cy="220" r="22" fill="#2f5bd3"/><text x="50" y="227" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="88" y="216">Cover coughs with your elbow</text>
<circle cx="50" cy="300" r="22" fill="#2f5bd3"/><text x="50" y="307" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="88" y="296">Stay home with a fever</text><text x="88" y="318" font-size="13" fill="#555">Return after 24 hours fever-free</text>
<circle cx="50" cy="390" r="22" fill="#2f5bd3"/><text x="50" y="397" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="88" y="386">Free flu shots: Dec 3, 3-6 PM</text><text x="88" y="408" font-size="13" fill="#555">School gym, no appointment needed</text></g>
<text x="200" y="490" text-anchor="middle" font-size="13" fill="#555">Questions? Call the nurse at 555-0142</text></svg>
